<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320" viewBox="0 0 440 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1220"/>
      <stop offset="1" stop-color="#1a1526"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5e3c"/>
      <stop offset="1" stop-color="#a9744a"/>
    </linearGradient>
    <linearGradient id="screenL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1321"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="screenR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#e9e5dc"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowR"><stop offset="0" stop-color="#f5f5f4" stop-opacity="0.25"/><stop offset="1" stop-color="#f5f5f4" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="clipL"><polygon points="86,96 196,72 196,150 86,174"/></clipPath>
    <clipPath id="clipR"><polygon points="226,72 336,96 336,174 226,150"/></clipPath>
    <style>
      .code { stroke-linecap: round; stroke-width: 3; stroke-dasharray: 80; stroke-dashoffset: 80; animation: type 8s steps(24) infinite; }
      .c1{animation-delay:0.0s}.c2{animation-delay:0.5s}.c3{animation-delay:1.0s}.c4{animation-delay:1.5s}
      .c5{animation-delay:2.0s}.c6{animation-delay:2.5s}.c7{animation-delay:3.0s}.c8{animation-delay:3.5s}
      @keyframes type { 0% { stroke-dashoffset: 80; opacity: 1 } 12%,80% { stroke-dashoffset: 0; opacity: 1 } 90%,100% { stroke-dashoffset: 80; opacity: 0 } }
      .caret { animation: blink 0.9s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0 } }

      .ui { opacity: 0; animation: pop 8s cubic-bezier(.2,.9,.3,1.3) infinite; transform-box: fill-box; transform-origin: center; }
      .u1{animation-delay:1.6s}.u2{animation-delay:2.4s}.u3{animation-delay:3.0s}.u4{animation-delay:3.6s}.u5{animation-delay:4.2s}.u6{animation-delay:4.8s}
      @keyframes pop { 0% { opacity: 0; transform: translateY(8px) scale(0.92) } 8%,78% { opacity: 1; transform: translateY(0) scale(1) } 88%,100% { opacity: 0; transform: translateY(0) scale(1) } }
      .btnPulse { animation: pulse 8s ease-in-out infinite; animation-delay: 5.4s; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,3% { transform: scale(1) } 5% { transform: scale(0.94) } 7%,100% { transform: scale(1) } }

      .lampGlow { animation: flicker 4s ease-in-out infinite; }
      @keyframes flicker { 0%,100% { opacity: .9 } 50% { opacity: .7 } }

      .leaf { transform-box: fill-box; transform-origin: bottom center; animation: sway 4s ease-in-out infinite; }
      .lf2 { animation-delay: -1.3s } .lf3 { animation-delay: -2.6s }
      @keyframes sway { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }

      .steam { fill: none; stroke: #d6d3d1; stroke-width: 1.4; stroke-linecap: round; opacity: 0; animation: steam 3s ease-out infinite; }
      .s2 { animation-delay: 1s } .s3 { animation-delay: 2s }
      @keyframes steam { 0% { opacity: 0; transform: translateY(3px) } 30% { opacity: .75 } 100% { opacity: 0; transform: translateY(-12px) } }

      .star { animation: twinkle 3s ease-in-out infinite; }
      .st2{animation-delay:1s}.st3{animation-delay:2s}.st4{animation-delay:.5s}
      @keyframes twinkle { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
    </style>
  </defs>

  <!-- room -->
  <rect width="440" height="320" rx="18" fill="url(#sky)"/>
  <rect x="0.5" y="0.5" width="439" height="319" rx="18" fill="none" stroke="#2a2440"/>
  <g fill="#cbd5e1">
    <circle class="star" cx="60" cy="40" r="1.2"/><circle class="star st2" cx="120" cy="26" r="1"/>
    <circle class="star st3" cx="380" cy="34" r="1.3"/><circle class="star st4" cx="330" cy="56" r="0.9"/><circle class="star st2" cx="410" cy="70" r="1"/>
  </g>
  <!-- window -->
  <g transform="translate(340 44)">
    <rect x="0" y="0" width="70" height="56" rx="4" fill="#1b2440" stroke="#2f3a5c"/>
    <circle cx="48" cy="18" r="9" fill="#fef3c7" opacity="0.9"/>
    <circle cx="52" cy="15" r="8" fill="#1b2440"/>
    <line x1="35" y1="0" x2="35" y2="56" stroke="#2f3a5c"/><line x1="0" y1="28" x2="70" y2="28" stroke="#2f3a5c"/>
  </g>

  <!-- lamp light cone -->
  <path class="lampGlow" d="M52 70 L10 240 L120 240 Z" fill="url(#lamp)"/>

  <!-- desk -->
  <polygon points="20,232 220,196 420,232 220,268" fill="url(#deskTop)"/>
  <polygon points="20,232 220,268 220,286 20,250" fill="#6b4529"/>
  <polygon points="420,232 220,268 220,286 420,250" fill="#5a3920"/>
  <rect x="40" y="248" width="8" height="40" fill="#3f2a18"/><rect x="392" y="248" width="8" height="40" fill="#3f2a18"/>
  <ellipse cx="220" cy="300" rx="190" ry="8" fill="#000" opacity="0.35"/>

  <!-- screen glows -->
  <ellipse cx="141" cy="125" rx="90" ry="60" fill="url(#glowL)" filter="url(#soft)"/>
  <ellipse cx="281" cy="125" rx="90" ry="60" fill="url(#glowR)" filter="url(#soft)"/>

  <!-- LEFT MONITOR: editor -->
  <g>
    <polygon points="80,92 200,66 200,156 80,182" fill="#1f2937"/>
    <polygon points="86,96 196,72 196,150 86,174" fill="url(#screenL)"/>
    <g clip-path="url(#clipL)">
      <polygon points="86,96 100,93 100,171 86,174" fill="#0a0f1c"/>
      <g transform="matrix(1 -0.218 0 1 0 0)">
        <line class="code c1" x1="106" y1="120" x2="150" y2="120" stroke="#c084fc"/>
        <line class="code c2" x1="112" y1="130" x2="180" y2="130" stroke="#7dd3fc"/>
        <line class="code c3" x1="112" y1="140" x2="160" y2="140" stroke="#86efac"/>
        <line class="code c4" x1="118" y1="150" x2="176" y2="150" stroke="#fde68a"/>
        <line class="code c5" x1="118" y1="160" x2="150" y2="160" stroke="#7dd3fc"/>
        <line class="code c6" x1="112" y1="170" x2="184" y2="170" stroke="#f9a8d4"/>
        <line class="code c7" x1="106" y1="180" x2="140" y2="180" stroke="#c084fc"/>
        <line class="code c8" x1="112" y1="190" x2="168" y2="190" stroke="#86efac"/>
        <rect class="caret" x="170" y="187" width="2.4" height="7" fill="#e2e8f0"/>
      </g>
    </g>
    <polygon points="132,182 148,178 148,200 132,204" fill="#374151"/>
    <polygon points="118,204 162,196 162,202 118,210" fill="#4b5563"/>
  </g>

  <!-- RIGHT MONITOR: the product -->
  <g>
    <polygon points="220,66 340,92 340,182 220,156" fill="#1f2937"/>
    <polygon points="226,72 336,96 336,174 226,150" fill="url(#screenR)"/>
    <g clip-path="url(#clipR)">
      <g transform="matrix(1 0.218 0 1 0 0)">
        <rect class="ui u1" x="232" y="26" width="98" height="8" rx="3" fill="#1c1917"/>
        <circle class="ui u1" cx="324" cy="30" r="2.6" fill="#f97316"/>
        <rect class="ui u2" x="232" y="42" width="58" height="7" rx="3" fill="#292524"/>
        <rect class="ui u3" x="232" y="53" width="86" height="4" rx="2" fill="#a8a29e"/>
        <rect class="ui u3" x="232" y="60" width="70" height="4" rx="2" fill="#a8a29e"/>
        <rect class="ui u4" x="232" y="72" width="30" height="24" rx="4" fill="#fff" stroke="#e7e5e4"/>
        <rect class="ui u4" x="266" y="72" width="30" height="24" rx="4" fill="#fff" stroke="#e7e5e4"/>
        <rect class="ui u5" x="300" y="72" width="30" height="24" rx="4" fill="#fff" stroke="#e7e5e4"/>
        <rect class="ui u5" x="237" y="77" width="12" height="3" rx="1.5" fill="#d6d3d1"/>
        <rect class="ui u5" x="271" y="77" width="12" height="3" rx="1.5" fill="#d6d3d1"/>
        <rect class="ui u5" x="305" y="77" width="12" height="3" rx="1.5" fill="#d6d3d1"/>
        <g class="ui u6">
          <rect class="btnPulse" x="232" y="104" width="44" height="12" rx="6" fill="#f97316"/>
        </g>
      </g>
    </g>
    <polygon points="272,178 288,182 288,204 272,200" fill="#374151"/>
    <polygon points="258,196 302,204 302,210 258,202" fill="#4b5563"/>
  </g>

  <!-- keyboard + mouse -->
  <polygon points="150,236 250,218 300,228 200,246" fill="#2b2f3a"/>
  <polygon points="150,236 200,246 200,250 150,240" fill="#1c1f27"/>
  <g fill="#3b4150">
    <polygon points="160,236 168,234.5 176,236 168,237.5"/><polygon points="172,234 180,232.5 188,234 180,235.5"/><polygon points="184,232 192,230.5 200,232 192,233.5"/>
    <polygon points="196,230 204,228.5 212,230 204,231.5"/><polygon points="208,228 216,226.5 224,228 216,229.5"/><polygon points="220,226 228,224.5 236,226 228,227.5"/>
    <polygon points="170,240 178,238.5 186,240 178,241.5"/><polygon points="182,238 190,236.5 198,238 190,239.5"/><polygon points="194,236 202,234.5 210,236 202,237.5"/>
    <polygon points="206,234 214,232.5 222,234 214,235.5"/><polygon points="218,232 226,230.5 234,232 226,233.5"/><polygon points="230,230 238,228.5 246,230 238,231.5"/>
    <polygon points="186,243 226,235 234,236.5 194,244.5"/>
  </g>
  <ellipse cx="322" cy="238" rx="11" ry="7" fill="#2b2f3a"/><ellipse cx="322" cy="236" rx="11" ry="7" fill="#3b4150"/>

  <!-- coffee -->
  <g transform="translate(96 200)">
    <path class="steam s1" d="M12 -4 c -3 -5 3 -8 0 -13"/>
    <path class="steam s2" d="M18 -4 c -3 -5 3 -8 0 -13"/>
    <path class="steam s3" d="M24 -4 c -3 -5 3 -8 0 -13"/>
    <ellipse cx="18" cy="0" rx="14" ry="5" fill="#f5f5f4"/>
    <path d="M4 0 v14 a14 5 0 0 0 28 0 v-14" fill="#e7e5e4"/>
    <ellipse cx="18" cy="0" rx="11" ry="3.6" fill="#3f2a1a"/>
    <path d="M32 3 h5 a5 5 0 0 1 0 10 h-5" fill="none" stroke="#e7e5e4" stroke-width="2.4"/>
  </g>

  <!-- plant -->
  <g transform="translate(372 176)">
    <g fill="#22c55e">
      <path class="leaf" d="M14 26 C 4 14, 6 2, 14 0 C 22 2, 24 14, 14 26 Z" fill="#16a34a"/>
      <path class="leaf lf2" d="M14 26 C 0 22, -6 10, 2 4 C 10 6, 14 16, 14 26 Z"/>
      <path class="leaf lf3" d="M14 26 C 28 22, 34 10, 26 4 C 18 6, 14 16, 14 26 Z" fill="#4ade80"/>
    </g>
    <path d="M2 26 h24 l-3 18 h-18 z" fill="#c2410c"/>
    <rect x="0" y="24" width="28" height="4" rx="1" fill="#ea580c"/>
  </g>

  <!-- lamp -->
  <g transform="translate(40 150)">
    <rect x="8" y="60" width="4" height="30" fill="#4b5563"/>
    <rect x="-2" y="88" width="24" height="4" rx="2" fill="#374151"/>
    <path d="M10 60 L4 20" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 -6 L14 -14 L28 8 L0 12 Z" fill="#374151"/>
    <ellipse cx="12" cy="-2" rx="16" ry="4" fill="#fde68a" class="lampGlow"/>
  </g>

  <!-- sticky notes -->
  <g transform="rotate(-6 60 96)"><rect x="58" y="90" width="18" height="18" fill="#fde68a"/><line x1="61" y1="96" x2="72" y2="96" stroke="#b45309" stroke-width="1"/><line x1="61" y1="100" x2="70" y2="100" stroke="#b45309" stroke-width="1"/></g>
  <g transform="rotate(5 60 118)"><rect x="60" y="112" width="18" height="18" fill="#fca5a5"/><line x1="63" y1="118" x2="74" y2="118" stroke="#991b1b" stroke-width="1"/><line x1="63" y1="122" x2="70" y2="122" stroke="#991b1b" stroke-width="1"/></g>
</svg>
